# 文件路径: .github/workflows/update-stats.yml
name: 📊 Update Learning Progress

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一凌晨2点自动运行
  workflow_dispatch: # 允许手动点击运行
  push:
    branches: [main]
    paths: ["**.md", "**.sol", "**.js", "**.ts"]

jobs:
  calculate-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整git历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run progress calculator
        run: python scripts/calculate_progress.py # ⬅️ 调用scripts目录下的脚本

      - name: Generate chart
        run: python scripts/generate_chart.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md stats.json progress-chart.svg
          git diff --staged --quiet || (git commit -m "📊 auto: update progress" && git push)
